name: Set up backend
description: Node 20, cached backend/node_modules (npm ci only on a cache miss), optionally the Prisma client.

inputs:
  prisma:
    description: Run `prisma generate` ('false' for jobs that never import the client).
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x

    - name: Restore node_modules
      id: modules
      uses: actions/cache@v4
      with:
        path: backend/node_modules
        key: backend-node-modules-${{ runner.os }}-node20-${{ hashFiles('backend/package-lock.json') }}

    - name: Install dependencies
      if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      working-directory: backend
      run: npm ci

    - name: Generate Prisma Client
      if: inputs.prisma == 'true'
      shell: bash
      working-directory: backend
      run: npx prisma generate
